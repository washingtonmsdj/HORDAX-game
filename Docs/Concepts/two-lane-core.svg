<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f2235"/>
      <stop offset="1" stop-color="#050a10"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a6cff"/>
      <stop offset="1" stop-color="#55d7ff"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a01822"/>
      <stop offset="1" stop-color="#ff4a3f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <text x="60" y="78" fill="#ffffff" font-family="Arial, sans-serif" font-size="52" font-weight="700">HORDAX — PISTA DUPLA</text>
  <text x="60" y="118" fill="#9fb4c8" font-family="Arial, sans-serif" font-size="24">CONCEITO PRINCIPAL APROVADO</text>

  <polygon points="250,700 530,700 575,165 410,165" fill="#122a3f" stroke="#3db9ff" stroke-width="5"/>
  <polygon points="530,700 950,700 790,165 575,165" fill="#241418" stroke="#ff4d43" stroke-width="5"/>
  <line x1="530" y1="700" x2="575" y2="165" stroke="#ffffff" stroke-width="8" opacity="0.85"/>

  <text x="310" y="655" fill="#74dbff" font-family="Arial, sans-serif" font-size="34" font-weight="700">ARMAS / UPGRADES</text>
  <text x="665" y="655" fill="#ff756a" font-family="Arial, sans-serif" font-size="34" font-weight="700">HORDA / BOSS</text>

  <g font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">
    <rect x="315" y="525" width="170" height="78" rx="10" fill="url(#blue)"/><text x="400" y="575" font-size="34" fill="#fff">50</text>
    <rect x="345" y="410" width="155" height="70" rx="10" fill="url(#blue)"/><text x="422" y="455" font-size="30" fill="#fff">230</text>
    <rect x="375" y="305" width="135" height="62" rx="10" fill="url(#blue)"/><text x="443" y="345" font-size="28" fill="#fff">300</text>
    <text x="405" y="548" font-size="18" fill="#e8f7ff">RIFLE</text>
  </g>

  <g fill="#ff5a4f" stroke="#ffb0a9" stroke-width="2">
    <circle cx="720" cy="555" r="23"/><circle cx="770" cy="530" r="23"/><circle cx="820" cy="565" r="23"/>
    <circle cx="680" cy="500" r="21"/><circle cx="735" cy="480" r="21"/><circle cx="790" cy="495" r="21"/><circle cx="845" cy="475" r="21"/>
    <circle cx="705" cy="420" r="18"/><circle cx="755" cy="405" r="18"/><circle cx="805" cy="420" r="18"/><circle cx="855" cy="395" r="18"/>
    <circle cx="725" cy="350" r="16"/><circle cx="770" cy="335" r="16"/><circle cx="815" cy="350" r="16"/>
    <circle cx="755" cy="285" r="14"/><circle cx="795" cy="275" r="14"/>
  </g>

  <g>
    <circle cx="730" cy="610" r="38" fill="#111827" stroke="#ff4a3f" stroke-width="5"/>
    <text x="730" y="620" fill="#fff" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="700">BOSS</text>
  </g>

  <g>
    <circle cx="430" cy="675" r="28" fill="#1f7cff" stroke="#bfe7ff" stroke-width="4"/>
    <rect x="422" y="610" width="16" height="52" rx="8" fill="#1f7cff"/>
    <line x1="438" y1="630" x2="500" y2="610" stroke="#7edbff" stroke-width="7"/>
    <text x="430" y="745" fill="#ffffff" font-family="Arial, sans-serif" font-size="22" text-anchor="middle">JOGADOR</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="24" fill="#dbe7f2">
    <text x="60" y="190">• UMA pista longa</text>
    <text x="60" y="228">• DUAS faixas paralelas</text>
    <text x="60" y="266">• armas e upgrades em uma faixa</text>
    <text x="60" y="304">• bichos, elites e boss na outra</text>
    <text x="60" y="342">• inimigos só vêm pela frente</text>
    <text x="60" y="380">• nunca pelas laterais ou por trás</text>
  </g>

  <text x="600" y="770" fill="#8fa7bb" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">Referência de gameplay, câmera, level design e arte final.</text>
</svg>